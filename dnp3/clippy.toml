# std macros that panic: `lib.rs` denies these outside of test builds, where they check results. A
# check that runs at compile time, in a `const` block, can't panic at runtime and takes a narrow
# `#[expect]`
disallowed-macros = [
    { path = "std::assert", reason = "panics: make the state unrepresentable, or return an error" },
    { path = "std::assert_eq", reason = "panics: make the state unrepresentable, or return an error" },
    { path = "std::assert_ne", reason = "panics: make the state unrepresentable, or return an error" },
    { path = "std::debug_assert", reason = "panics in builds with debug assertions: make the state unrepresentable, or return an error" },
    { path = "std::debug_assert_eq", reason = "panics in builds with debug assertions: make the state unrepresentable, or return an error" },
    { path = "std::debug_assert_ne", reason = "panics in builds with debug assertions: make the state unrepresentable, or return an error" },
]

# std types whose methods panic on their state rather than an argument
disallowed-types = [
    { path = "std::cell::RefCell", reason = "a conflicting borrow panics: use Cell, or restructure so the borrow checker proves exclusive access" },
]
