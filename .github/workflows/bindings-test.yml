name: Bindings test
on:
  # ci.yml calls this for every PR, merge group and tag, as the bindings-test check
  workflow_call:
  # Runs on main save the Maven and NuGet caches the other runs restore: a cache saved by a PR or
  # merge-group run is visible only to that ref, and Maven Central rate-limits (HTTP 429) runners
  # that download every plugin on each run
  push:
    branches: [main]
    paths:
      - "ffi/**"
      - ".github/workflows/bindings-test.yml"
  # Best effort: keeps the main cache from expiring after a week without bindings changes
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
# what the rust-toolchain action set before the jobs installed Rust with rustup
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
jobs:
  # Run the bindings' smoke tests (C, C++, .NET, Java) against libraries built like the shipped ones
  bindings-test:
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache Maven and NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.nuget/packages
          key: binding-deps-${{ hashFiles('ffi/bindings/java/**/pom.xml', 'ffi/bindings/dotnet/**/*.csproj') }}
          restore-keys: binding-deps-
      - name: Build the C and Java libraries
        run: cargo build --release --locked -p dnp3-ffi-c -p dnp3-ffi-java
      - name: Test C and C++ bindings
        run: cargo run --bin dnp3-bindings -- --c
      - name: Test .NET bindings
        run: cargo run --bin dnp3-bindings -- --dotnet
      - name: Test Java bindings
        run: cargo run --bin dnp3-bindings -- --java
