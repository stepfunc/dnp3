name: Conformance
on:
  # Runs on PRs only when they carry the `conformance` label (see CLAUDE.md)
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Best effort: GitHub may delay or drop scheduled runs
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # ci.yml calls this for release tags, so quality-gate waits on it and the release jobs publish its results
  workflow_call:
permissions:
  contents: read
jobs:
  # Run the conformance tests, for each revision of the test procedures at the subset level it tests
  conformance-run:
    name: conformance (${{ matrix.revision }}, level ${{ matrix.level }})
    # on PRs, run when labeled `conformance`, and not again when some other label is added
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'conformance') &&
       (github.event.action != 'labeled' || github.event.label.name == 'conformance'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: "2.7"
            level: 2
          - revision: "3.1r1"
            level: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build JNI
        run: cargo build --release -p dnp3-ffi-java
      - name: Build Java bindings
        run: cargo run --release --bin dnp3-bindings -- --java
      - name: Install Java bindings
        shell: bash
        run: (cd ffi/bindings/java/dnp3 && sudo mvn install)
      - name: Capture packets during the conformance tests
        working-directory: conformance
        # capturing needs root, which the tests run as; local runs leave it off
        run: echo "tcp.capture.adapter = /127.0.0.1" >> device.ini
      - name: Select the subset level
        working-directory: conformance
        # device.ini is for 3.1r1 at level 3; a later value overrides it
        run: echo "outstation.subset.level = ${{ matrix.level }}" >> device.ini
      - name: Run the conformance tests
        working-directory: conformance
        run: sudo mvn --batch-mode scala:run -Dconformance.revision=${{ matrix.revision }}
      - name: Check the packet captures
        # dnp3c keeps each revision's results, for each subset level, in a folder of its own
        working-directory: conformance/results/${{ matrix.revision }}/L${{ matrix.level }}
        # every procedure whose log shows a transmitted frame ("--P->") must have captured packets;
        # a pcap of only its 24-octet header captured none
        run: |
          sent=0
          empty=0
          for dir in */; do
            grep -qE -- '--P-(>|&gt;)' "$dir/log.html" 2>/dev/null || continue
            sent=$((sent + 1))
            if [ ! -f "$dir/dump.pcap" ] || [ "$(stat -c %s "$dir/dump.pcap")" -le 24 ]; then
              echo "No packets captured for ${dir%/}"
              empty=$((empty + 1))
            fi
          done
          echo "$sent procedures sent frames; $empty captured no packets"
          [ "$sent" -gt 0 ] && [ "$empty" -eq 0 ]
      - name: Upload conformance test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results-${{ matrix.revision }}
          path: conformance/results
