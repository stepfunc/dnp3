name: CI
on:
  push:
    tags:
      - "*"
  pull_request:
  # The merge queue runs the required checks on each queued merge result
  merge_group:
  # Builds everything a tag builds, without publishing
  workflow_dispatch:
# Jobs that write with GITHUB_TOKEN ask for it themselves
permissions:
  contents: read
# what the rust-toolchain action set before the jobs installed Rust with rustup
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
# A newer push to a PR cancels its older run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Check formatting and run clippy lints
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the build
        # only PR runs cache, so tag and merge-queue builds never restore one a PR wrote, and this
        # job builds nothing that ships
        if: github.event_name == 'pull_request' # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Clippy the core crate with all features (ring)
        run: cargo clippy -p dnp3 --features ffi,serialization,unstable -- -D warnings
      - name: Clippy the core crate with all features (AWS-LC)
        run: cargo clippy -p dnp3 --no-default-features --features ffi,serial,tls-aws-lc,serialization,unstable -- -D warnings
  # Build the workspace with the feature permutations not built by default
  features:
    strategy:
      fail-fast: false
      matrix:
        feature-args:
          - "--no-default-features"
          - "--no-default-features --features serialization"
          - "--no-default-features --features serial"
          - "--no-default-features --features tls"
          - "--no-default-features --features tls-aws-lc"
          - "--no-default-features --features unstable"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the build
        # only PR runs cache, so tag and merge-queue builds never restore one a PR wrote, and this
        # job builds nothing that ships
        if: github.event_name == 'pull_request' # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the workspace with the features
        run: cargo build --release -p dnp3 -p dnp3-ffi-c -p dnp3-ffi-java ${{ matrix.feature-args }}
      - name: Clippy the core crate and its tests with the features
        run: cargo clippy -p dnp3 --all-targets ${{ matrix.feature-args }} -- -D warnings
  # Check the workspace with the minimum supported Rust version declared in Cargo.toml
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the minimum supported Rust version
        id: msrv
        # a two-part rust-version means the .0 release, so check exactly that toolchain
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="$version.0"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # rust-toolchain.toml selects the newer toolchain, so every command here names this one
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal
      - name: Cache the build
        # only PR runs cache, so tag and merge-queue builds never restore one a PR wrote, and this
        # job builds nothing that ships
        if: github.event_name == 'pull_request' # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # the action runs rustc and cargo to key the cache, so they must be this toolchain too
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
      - name: Check the workspace
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --locked --workspace --all-targets
      - name: Check the AWS-LC TLS backend
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --locked -p dnp3 --no-default-features --features tls-aws-lc,serial,serialization,unstable
  # Run the unit tests on Linux, and on Windows too in the merge queue, on tags and manual runs
  test:
    # a test that hangs fails the job instead of holding it for GitHub's six-hour default
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the build
        # only PR runs cache, so tag and merge-queue builds never restore one a PR wrote, and this
        # job builds nothing that ships
        if: github.event_name == 'pull_request' # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run Rust unit tests
        run: cargo test --workspace --features dnp3/unstable,dnp3/serialization
      - name: Run the core crate's tests with the AWS-LC TLS backend
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p dnp3 --no-default-features --features serial,tls-aws-lc,serialization,unstable
  # Check that a change keeps the core crate's public API semver compatible with the revision it
  # merges into. Tag pushes and manual runs have no such revision, so only the checkout runs there.
  # The checker is pinned, like the toolchain in rust-toolchain.toml, so an upstream release can't
  # fail an unchanged PR (the checker reads rustdoc's JSON, whose format changes with the toolchain);
  # raise them together
  semver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust from rust-toolchain.toml
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: rustup toolchain install
      - name: Install cargo-semver-checks
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: $/.github/actions/cargo-tool
        with:
          crate: cargo-semver-checks
          version: 0.51.0
      - name: Compare the public API with the base revision
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          rust-toolchain: manual
          package: dnp3
          # the features with public API that semver covers: unstable is exempt, and ffi only
          # serves the FFI crates; tls and tls-aws-lc can't be enabled together
          feature-group: only-explicit-features
          features: default,serialization
          # every change must be at most a minor release; derived from a pre-release version
          # (such as X.Y.Z-M3) the tool would skip every check
          release-type: minor
          baseline-rev: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  # Check that the parsers can't panic for any input, and the encoders, the outstation's event
  # buffer and deferred READ storage for any value, database and output buffer up to 16 MiB
  # (dnp3/src/no_panic_check.rs), with arithmetic overflow checks off
  # as in release and on as in debug. The proof comes from the optimizer, so it depends on the
  # toolchain rust-toolchain.toml pins: a new one can lose an optimization and fail the link
  # without any change to the code.
  no-panic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the build
        # only PR runs cache, so tag and merge-queue builds never restore one a PR wrote, and this
        # job builds nothing that ships
        if: github.event_name == 'pull_request' # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Link the parsers, encoders and responses with the no-panic check
        run: cargo test -p dnp3 --lib --release --no-run
        env:
          RUSTFLAGS: --cfg dnp3_no_panic
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      - name: Link them again with overflow checks on
        run: cargo test -p dnp3 --lib --release --no-run
        env:
          RUSTFLAGS: --cfg dnp3_no_panic
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
  # Everything below builds the bindings and their packages: in the merge queue, on tags and on
  # manual runs, not on a PR's own pushes. A PR's FFI changes are compiled by clippy and bindings-test
  # Build API documentation packages
  documentation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install doxygen 1.9.5
        run: |
          wget -q https://github.com/stepfunc/ci-files/raw/2440f58201959ddfd6bca2597b48d3948bb08948/doxygen/doxygen-1.9.5.linux.bin.tar.gz -O doxygen.tar.gz
          echo "3b46471e7d4c3496e194d95042c7e5f738b93debacd22193aacc3df4dfe66267  doxygen.tar.gz" | sha256sum -c -
          sudo tar --strip-components=1 -C /usr -xzf doxygen.tar.gz doxygen-1.9.5
          rm doxygen.tar.gz
      - name: Build FFI and JNI
        run: cargo build --release -p dnp3-ffi-c -p dnp3-ffi-java
      - name: Build Rustdoc
        run: cargo doc -p dnp3 --no-deps
      - name: C bindings
        run: cargo run --bin dnp3-bindings -- --c --doxygen --no-tests
      - name: .NET bindings
        run: cargo run --bin dnp3-bindings -- --dotnet --doxygen --no-tests
      - name: Java bindings
        run: cargo run --bin dnp3-bindings -- --java
      - name: Extract documentation
        run: |
          mkdir -p ~/doc
          cp -a target/doc ~/doc/rust
          cp -a ffi/bindings/c/generated/doc/c ~/doc/c
          cp -a ffi/bindings/c/generated/doc/cpp ~/doc/cpp
          cp -a ffi/bindings/dotnet/dnp3/doc ~/doc/dotnet
          cp -a ffi/bindings/java/dnp3/target/apidocs ~/doc/java
          rm ffi/bindings/c/generated/logo.png ffi/bindings/c/generated/doxygen-awesome.css
      - name: Upload documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-api
          path: ~/doc
    # Build bindings on Windows x64 [64-bit MSVC (Windows 10+) (x86_64-pc-windows-msvc)] and x86 [32-bit MSVC (Windows 10+) (i686-pc-windows-msvc)]
  bindings-windows:
    if: github.event_name != 'pull_request'
    # Release tags build the shipped libraries with one codegen unit and thin LTO (smaller and faster,
    # but slower to build); other runs keep cargo's release defaults. Symbols are not stripped
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'thin' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc # 64-bit MSVC (Windows 10+)
            test: true
          - target: i686-pc-windows-msvc # 32-bit MSVC (Windows 10+)
            test: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NASM
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Rust from rust-toolchain.toml
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Create FFI modules DIR
        run: mkdir ffi-modules\${{ matrix.target }}
      - name: Build FFI
        shell: bash
        run: bash .github/scripts/build-evidence.sh evidence/ffi/${{ matrix.target }} cargo -p dnp3-ffi-c --target ${{ matrix.target }} --no-default-features --features serial,tls-aws-lc
      - name: Build JNI
        shell: bash
        run: bash .github/scripts/build-evidence.sh evidence/java/${{ matrix.target }} cargo -p dnp3-ffi-java --target ${{ matrix.target }} --no-default-features --features serial,tls-aws-lc
      - name: Copy the FFI and JNI libs
        shell: pwsh
        run: |
          Copy-Item -Path ./target/${{ matrix.target }}/release/dnp3_ffi.dll -Destination ffi-modules/${{ matrix.target }}
          Copy-Item -Path ./target/${{ matrix.target }}/release/dnp3_ffi.dll.lib -Destination ffi-modules/${{ matrix.target }}
          Copy-Item -Path ./target/${{ matrix.target }}/release/dnp3_ffi_java.dll -Destination ffi-modules/${{ matrix.target }}
      - name: Upload compiled FFI modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffi-modules-${{ matrix.target }}
          path: ffi-modules
      - name: Upload build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.target }}
          path: evidence
      - name: Test C Bindings
        if: ${{ matrix.test }}
        run: cargo run --bin dnp3-bindings -- --c -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
      - name: Test .NET Bindings
        if: ${{ matrix.test }}
        run: cargo run --bin dnp3-bindings -- --dotnet -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
      - name: Test Java
        if: ${{ matrix.test }}
        run: cargo run --bin dnp3-bindings -- --java -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
  # Build bindings on macOS: x86_64-apple-darwin (macOS 10.12+) and aarch64-apple-darwin (macOS 11.0+)
  bindings-macos:
    if: github.event_name != 'pull_request'
    # Release tags build the shipped libraries with one codegen unit and thin LTO (smaller and faster,
    # but slower to build); other runs keep cargo's release defaults. Symbols are not stripped
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'thin' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Create FFI modules dir
        run: mkdir -p ffi-modules/${{ matrix.target }}
      - name: Build FFI
        run: bash .github/scripts/build-evidence.sh evidence/ffi/${{ matrix.target }} cargo -p dnp3-ffi-c --target ${{ matrix.target }} --no-default-features --features serial,tls-aws-lc
      - name: Build JNI
        run: bash .github/scripts/build-evidence.sh evidence/java/${{ matrix.target }} cargo -p dnp3-ffi-java --target ${{ matrix.target }} --no-default-features --features serial,tls-aws-lc
      - name: Copy the FFI and JNI libs
        run: |
          cp ./target/${{ matrix.target }}/release/libdnp3_ffi.dylib ./ffi-modules/${{ matrix.target }}
          cp ./target/${{ matrix.target }}/release/libdnp3_ffi_java.dylib ./ffi-modules/${{ matrix.target }}
      - name: Upload compiled FFI modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffi-modules-${{ matrix.target }}
          path: ffi-modules
      - name: Upload build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.target }}
          path: evidence
      - name: Test .NET bindings
        run: cargo run --bin dnp3-bindings -- --dotnet -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
      - name: Test Java bindings
        run: cargo run --bin dnp3-bindings -- --java -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
  # Cross-compilation for Linux to produce portable C and JNI libraries
  bindings-linux:
    if: github.event_name != 'pull_request'
    # Release tags build the shipped libraries with one codegen unit and thin LTO (smaller and faster,
    # but slower to build); other runs keep cargo's release defaults. Symbols are not stripped
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'thin' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}
      # By default, MUSL will not produce a cdylib with dynamic linkage to MUSL LIB C
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=-crt-static"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=-crt-static"
      CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_RUSTFLAGS: "-C target-feature=-crt-static"
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu # 64-bit Linux (kernel 3.2+, glibc 2.17+)
          - i686-unknown-linux-gnu # 32-bit Linux (kernel 3.2+, glibc 2.17+)
          - x86_64-unknown-linux-musl # 64-bit Linux with MUSL
          - arm-unknown-linux-gnueabihf # ARMv6 Linux, hardfloat (kernel 3.2+, glibc 2.17+)
          - arm-unknown-linux-musleabihf # ARMv6 Linux with MUSL, hardfloat
          - aarch64-unknown-linux-gnu # ARM64 Linux (kernel 4.1+, glibc 2.17+)
          - aarch64-unknown-linux-musl # ARM64 Linux with MUSL
          - armv7-unknown-linux-gnueabihf # ARMv7 Linux, hardfloat (kernel 3.2+, glibc 2.17+)
          - arm-unknown-linux-gnueabi # ARMv6 Linux (kernel 3.2+, glibc 2.17+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Install Rust Cross
        run: cargo install cross --locked --version 0.2.5
      - name: Create FFI modules dir
        run: mkdir -p ffi-modules/${{ matrix.target }}
      - name: Build FFI
        run: bash .github/scripts/build-evidence.sh evidence/ffi/${{ matrix.target }} cross -p dnp3-ffi-c --target ${{ matrix.target }} --no-default-features --features serial,tls-aws-lc
      - name: Build JNI
        run: bash .github/scripts/build-evidence.sh evidence/java/${{ matrix.target }} cross -p dnp3-ffi-java --target ${{ matrix.target }} --no-default-features --features serial,tls-aws-lc
      - name: Copy the FFI and JNI libs
        run: |
          cp ./target/${{ matrix.target }}/release/libdnp3_ffi.so ./ffi-modules/${{ matrix.target }}
          cp ./target/${{ matrix.target }}/release/libdnp3_ffi_java.so ./ffi-modules/${{ matrix.target }}
      - name: Upload compiled FFI modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffi-modules-${{ matrix.target }}
          path: ffi-modules
      - name: Upload build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.target }}
          path: evidence
  # Run the bindings' smoke tests (C, C++, .NET, Java) against libraries built like the shipped ones
  bindings-test:
    uses: $/.github/workflows/bindings-test.yml
  guide:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        working-directory: guide
        run: npm ci
      - name: Build guide
        working-directory: guide
        run: |
         npm run build
         mkdir -p ~/doc/guide
         mv build/* ~/doc/guide
      - name: Upload guide
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-guide
          path: ~/doc
  # Package all the generated bindings
  packaging:
    needs: [documentation, guide, bindings-windows, bindings-macos, bindings-linux]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install bom-tools
        # 0.3.0
        run: cargo install --locked --git https://github.com/stepfunc/bom-tools.git --rev a5c5797217b26f74f5682c0551daaffa501f7fd6
      - name: Download compiled FFI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ffi-modules
          pattern: ffi-modules-*
          merge-multiple: true
      - name: Download build evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: evidence
          pattern: evidence-*
          merge-multiple: true
      - name: Create third-party license reports and SBOMs
        run: |
          cargo metadata --format-version 1 --all-features --locked > metadata.json
          COMMON="-m metadata.json -c allowed.json"
          bom-tools licenses -e evidence/ffi --root-package dnp3-ffi-c $COMMON > third-party-licenses.txt
          bom-tools licenses -e evidence/java --root-package dnp3-ffi-java $COMMON > third-party-licenses-java.txt
          mkdir sboms
          bom-tools sbom -e evidence/ffi --root-package dnp3-ffi-c $COMMON --lockfile Cargo.lock > sboms/dnp3-ffi.cdx.json
          bom-tools sbom -e evidence/java --root-package dnp3-ffi-java $COMMON --lockfile Cargo.lock > sboms/dnp3-ffi-java.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: sboms
      - name: Package C/C++ bindings
        run: cargo run --bin dnp3-bindings -- --c --package ./ffi-modules --options ./packaging.json -f third-party-licenses.txt -f sboms/dnp3-ffi.cdx.json
      - name: Package .NET bindings
        run: cargo run --bin dnp3-bindings -- --dotnet --package ./ffi-modules --options ./packaging.json -f third-party-licenses.txt -f sboms/dnp3-ffi.cdx.json
      - name: Package Java bindings
        run: cargo run --bin dnp3-bindings -- --java --package ./ffi-modules --options ./packaging.json -f third-party-licenses-java.txt -f sboms/dnp3-ffi-java.cdx.json
      - name: Upload C/C++ bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-bindings
          path: ffi/bindings/c/generated/*
      - name: Upload .NET bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-bindings
          path: ffi/bindings/dotnet/nupkg/dnp3*
      - name: Upload Java bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-bindings-jar
          path: ffi/bindings/java/dnp3/target/*.jar
      - name: Upload Java pom.xml
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-bindings-pom
          path: ffi/bindings/java/dnp3/pom.xml
  # Run the conformance tests for releases; PRs labeled `conformance` run them through conformance.yml itself
  conformance:
    if: startsWith(github.ref, 'refs/tags/')
    uses: $/.github/workflows/conformance.yml
  # The one roll-up check: branch protection and the merge queue require it, and the release jobs
  # wait on it. It passes only if every job the event runs passed. Packaging (with the
  # documentation and platform builds it needs) is skipped on a PR's own pushes, and conformance
  # runs only on tags; those skips are the only ones that pass
  quality-gate:
    needs: [linting, features, msrv, test, semver, no-panic, bindings-test, packaging, conformance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the CI jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e --arg event "$EVENT" --arg tag "$TAG_PUSH" 'to_entries | all(
            .value.result == "success"
            or (.value.result == "skipped" and .key == "packaging" and $event == "pull_request")
            or (.value.result == "skipped" and .key == "conformance" and $tag != "true"))'

  # Release jobs - each can run independently and is idempotent
  # crates.io and nuget.org trust this workflow in these environments (trusted publishing), so
  # neither needs a stored API key
  # Everything a release needs that a publisher would otherwise find out only after others published
  release-check:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Check the tag matches the crate version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dnp3") | .version')
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "❌ tag ${GITHUB_REF_NAME} doesn't match the crate version $VERSION"
            exit 1
          fi
      - name: Download conformance test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conformance-results-*
          merge-multiple: true
          path: conformance-results
      - name: Check both conformance reports exist
        working-directory: conformance-results
        run: |
          # the guide links to each report conformance.yml runs
          for expected in 2.7/L2 3.1r1/L3; do
            if [ ! -f "$expected/report.html" ]; then
              echo "::error::missing conformance report $expected/report.html"
              exit 1
            fi
          done

  release-crates-io:
    needs: [release-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Check whether this version is already published
        id: published
        run: |
          VERSION=${GITHUB_REF_NAME}
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-all-errors \
            -A "stepfunc/dnp3 release workflow" "https://crates.io/api/v1/crates/dnp3/$VERSION")
          case "$STATUS" in
            200)
              echo "✅ dnp3 $VERSION already published to crates.io - skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "Publishing dnp3 $VERSION to crates.io..."
              ;;
            *)
              echo "❌ crates.io returned HTTP $STATUS"
              exit 1
              ;;
          esac
      - name: Authenticate with crates.io
        if: steps.published.outputs.skip != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish to crates.io
        if: steps.published.outputs.skip != 'true'
        run: cargo publish -p dnp3
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release-docs:
    needs: [release-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: release
    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: doc-*
      - name: Download conformance test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # each revision's artifact holds <revision>/L<level>/, so they merge without colliding
          pattern: conformance-results-*
          merge-multiple: true
          path: artifacts/conformance-results
      - name: Index the conformance test reports
        working-directory: artifacts/conformance-results
        run: |
          {
            echo '<!DOCTYPE html>'
            echo '<html><head><meta charset="utf-8"><title>dnp3 conformance test reports</title></head><body>'
            echo '<h1>dnp3 conformance test reports</h1><ul>'
            for report in */L*/report.html; do
              echo "<li><a href=\"$report\">Revision ${report%%/*}, subset level $(echo "$report" | cut -d/ -f2 | tr -d L)</a></li>"
            done
            echo '</ul></body></html>'
          } > index.html
          cat index.html
      - name: Checkout stepfunc/docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the push step uses the deploy key this checkout keeps, and this job uploads no artifacts
          # zizmor: ignore[artipacked]
          repository: stepfunc/docs
          ssh-key: ${{ secrets.SFIO_DOCS_SSH_KEY }}
          path: docs
      - name: Upload docs
        working-directory: docs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # Pull latest changes to avoid conflicts
          git pull
          # Remove and recreate docs directory
          rm -rf ./dnp3/${GITHUB_REF_NAME}
          mkdir -p ./dnp3/${GITHUB_REF_NAME}
          cp -a ../artifacts/doc-api/* ./dnp3/${GITHUB_REF_NAME}
          cp -a ../artifacts/doc-guide/* ./dnp3/${GITHUB_REF_NAME}
          cp -a ../artifacts/conformance-results ./dnp3/${GITHUB_REF_NAME}/conformance
          # Remove versions superseded under the docs repo's retention policy
          ./scripts/prune.sh
          # Send docs.stepfunc.io/dnp3/ to the guide of the newest full release (not milestones or RCs),
          # so a maintenance release of an older version doesn't move it back. It targets the guide's
          # first page, which every version has (guide/ itself has no page before 1.8.0)
          latest=$(ls ./dnp3 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -n "$latest" ]]; then
            echo "<!DOCTYPE html><meta charset=\"utf-8\"><title>DNP3 documentation</title><meta http-equiv=\"refresh\" content=\"0; url=./$latest/guide/docs/guide/\"><link rel=\"canonical\" href=\"./$latest/guide/docs/guide/\">" > ./dnp3/index.html
          fi
          # Check if there are actual changes to commit
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit - docs already up to date"
          else
            git commit -m "[dnp3] release ${GITHUB_REF_NAME}"
            git push
          fi
  
  release-maven:
    needs: [release-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: release
    steps:
      - name: Download Java artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: java-bindings-*
      # The secret holds only the signing subkey, with the primary key as a stub, so there's nothing to
      # unlock here: the signing below passes the passphrase itself
      - name: Import PGP key
        id: import_gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.SFIO_PGP_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_OUTPUT"
      # Succeeds only once the version is published on Maven Central, not when the upload is accepted
      - name: Deploy Java to Maven Central
        shell: bash
        working-directory: artifacts
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.SFIO_PGP_PRIVATE_KEY_PASSPHRASE }}
        run: |
          V="${GITHUB_REF_NAME}"
          CENTRAL="https://repo1.maven.org/maven2/io/stepfunc/dnp3/$V"
          FILES="dnp3-$V.pom dnp3-$V.jar dnp3-$V-sources.jar dnp3-$V-javadoc.jar"
          on_central() {
            for file in $FILES; do
              curl -f -s -I -o /dev/null "$CENTRAL/$file" || return 1
            done
          }
          # about 30 minutes; RC1 took 8
          wait_for_central() {
            for _ in $(seq 60); do
              on_central && return 0
              sleep 30
            done
            echo "::error::io.stepfunc:dnp3:$V isn't on Maven Central after 30 minutes"
            return 1
          }

          if curl -f -s -I -o /dev/null "$CENTRAL/dnp3-$V.jar"; then
            if on_central; then
              echo "✅ io.stepfunc:dnp3:$V is already on Maven Central"
              exit 0
            fi
            echo "::error::io.stepfunc:dnp3:$V is on Maven Central without all of: $FILES"
            exit 1
          fi

          # Maven repository layout from the groupId down, each file signed and checksummed
          mkdir -p "io/stepfunc/dnp3/$V"
          cp java-bindings-pom/pom.xml "io/stepfunc/dnp3/$V/dnp3-$V.pom"
          cp "java-bindings-jar/dnp3-$V.jar" "java-bindings-jar/dnp3-$V-sources.jar" \
            "java-bindings-jar/dnp3-$V-javadoc.jar" "io/stepfunc/dnp3/$V/"
          (
            cd "io/stepfunc/dnp3/$V"
            for file in *.jar *.pom; do
              gpg --batch --yes --pinentry-mode loopback --local-user "$GPG_FINGERPRINT" --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$file"
              md5sum "$file" | cut -d' ' -f1 > "$file.md5"
              sha1sum "$file" | cut -d' ' -f1 > "$file.sha1"
            done
          )
          zip -r bundle.zip io/

          AUTH="Authorization: Bearer $(echo -n "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_TOKEN" | base64 -w 0)"
          RESPONSE=$(curl -s -X POST \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
            -H "$AUTH" \
            -F "bundle=@bundle.zip;type=application/octet-stream" \
            -w "\nHTTP_STATUS:%{http_code}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Upload: HTTP $HTTP_STATUS $BODY"

          if [[ $HTTP_STATUS -eq 400 ]] && [[ "$BODY" =~ "duplicate" || "$BODY" =~ "already exists" || "$BODY" =~ "PUBLISHED" ]]; then
            # an earlier attempt uploaded it; there's no deployment id to poll, so wait for the files
            wait_for_central
            exit $?
          fi
          if [[ $HTTP_STATUS -lt 200 || $HTTP_STATUS -ge 300 ]]; then
            echo "::error::upload failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          # the upload returns the deployment id as plain text
          DEPLOYMENT_ID=$(echo "$BODY" | tr -d '[:space:]')
          for _ in $(seq 60); do
            STATUS=$(curl -s -X POST -H "$AUTH" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID")
            STATE=$(echo "$STATUS" | jq -r '.deploymentState // "UNKNOWN"')
            echo "Deployment $DEPLOYMENT_ID: $STATE"
            case "$STATE" in
              PUBLISHED)
                echo "✅ io.stepfunc:dnp3:$V is published"
                exit 0
                ;;
              FAILED)
                echo "::error::Maven Central rejected the deployment: $(echo "$STATUS" | jq -c '.errors')"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::deployment $DEPLOYMENT_ID isn't published after 30 minutes"
          exit 1

  release-nuget:
    needs: [release-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download .NET artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-bindings
          path: artifacts/dotnet-bindings
      # the temporary API key lasts an hour, so get it just before pushing
      - name: Authenticate with nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet package
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # Use --skip-duplicate to make this idempotent
          dotnet nuget push $(find artifacts/dotnet-bindings/dnp3*.nupkg) \
            -s https://api.nuget.org/v3/index.json \
            -k "$NUGET_API_KEY" \
            --skip-duplicate
  
  create-github-release:
    needs: [release-docs, release-maven, release-nuget, release-crates-io]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: release
    # attests the release files and creates the draft release with them; Adam reviews and publishes it
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Assemble the release files
        run: |
          V="${GITHUB_REF_NAME}"
          mkdir release conformance-results
          (cd artifacts/c-bindings && zip -r "../../release/dnp3-$V.zip" .)
          # each revision's results are in an artifact of its own, holding <revision>/L<level>/
          cp -a artifacts/conformance-results-*/. conformance-results/
          (cd conformance-results && zip -r ../release/conformance-results.zip .)
          cp artifacts/dotnet-bindings/dnp3.*nupkg artifacts/java-bindings-jar/*.jar artifacts/sboms/*.cdx.json release/
          # exactly these, so the upload and the attestation cover the same complete set
          expected="dnp3-$V.zip conformance-results.zip dnp3.$V.nupkg dnp3.$V.snupkg dnp3-$V.jar
            dnp3-$V-sources.jar dnp3-$V-javadoc.jar dnp3-ffi.cdx.json dnp3-ffi-java.cdx.json"
          diff <(printf '%s\n' $expected | sort) <(ls release | sort)
      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME}"
          # a rerun replaces its own draft whole; a release Adam already published is left alone
          if DRAFT=$(gh release view "$V" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>err); then
            if [ "$DRAFT" != "true" ]; then
              echo "::error::release $V is already published"
              exit 1
            fi
            gh release delete "$V" --repo "$GITHUB_REPOSITORY" --yes
          elif ! grep -q "release not found" err; then
            cat err
            exit 1
          fi
          # milestones and release candidates (X.Y.Z-Mn, X.Y.Z-RCn) are pre-releases
          PRERELEASE=()
          if [[ "$V" == *-* ]]; then
            PRERELEASE=(--prerelease)
          fi
          gh release create "$V" release/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$V" --notes "" "${PRERELEASE[@]}"
