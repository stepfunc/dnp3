name: CI
on:
  push:
    tags:
      - "*"
  pull_request:
  # The merge queue runs the required checks on each queued merge result
  merge_group:
# Jobs that write with GITHUB_TOKEN ask for it themselves
permissions:
  contents: read
# A newer push to a PR cancels its older run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Check formatting and run clippy lints
  linting:
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Clippy the core crate with all features (ring)
        run: cargo clippy -p dnp3 --features ffi,serialization,unstable -- -D warnings
      - name: Clippy the core crate with all features (AWS-LC)
        run: cargo clippy -p dnp3 --no-default-features --features ffi,serial,tls-aws-lc,serialization,unstable -- -D warnings
  # Build the workspace with the feature permutations not built by default
  features:
    strategy:
      fail-fast: false
      matrix:
        feature-args:
          - "--no-default-features"
          - "--no-default-features --features serialization"
          - "--no-default-features --features serial"
          - "--no-default-features --features tls"
          - "--no-default-features --features tls-aws-lc"
          - "--no-default-features --features unstable"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - name: Build the workspace with the features
        run: cargo build --release -p dnp3 -p dnp3-ffi-c -p dnp3-ffi-java ${{ matrix.feature-args }}
      - name: Clippy the core crate and its tests with the features
        run: cargo clippy -p dnp3 --all-targets ${{ matrix.feature-args }} -- -D warnings
  # Check the workspace with the minimum supported Rust version declared in Cargo.toml
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read the minimum supported Rust version
        id: msrv
        # a two-part rust-version means the .0 release, so check exactly that toolchain
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="$version.0"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Check the workspace
        run: cargo check --locked --workspace --all-targets
      - name: Check the AWS-LC TLS backend
        run: cargo check --locked -p dnp3 --no-default-features --features tls-aws-lc,serial,serialization,unstable
  # Run the unit tests on Windows and Linux
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        rust:
          - stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Run Rust unit tests
        run: cargo test --features unstable
  # Check that the parsers can't panic for any input, and the encoders, the outstation's event
  # buffer and deferred READ storage for any value, database and output buffer up to 16 MiB
  # (dnp3/src/no_panic_check.rs), with arithmetic overflow checks off
  # as in release and on as in debug. The proof comes from the optimizer, so the toolchain is
  # pinned: a new one can lose an optimization and fail the link without any change to the code.
  # Raise it deliberately.
  no-panic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - name: Link the parsers, encoders and responses with the no-panic check
        run: cargo test -p dnp3 --lib --release --no-run
        env:
          RUSTFLAGS: --cfg dnp3_no_panic
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      - name: Link them again with overflow checks on
        run: cargo test -p dnp3 --lib --release --no-run
        env:
          RUSTFLAGS: --cfg dnp3_no_panic
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
  # Build API documentation packages
  # Paused on PRs during the 1.8.0 refactor series; release tags still build them. Restore before 1.8.0
  documentation:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
      - name: Install doxygen 1.9.5
        run: wget -q https://github.com/stepfunc/ci-files/raw/main/doxygen/doxygen-1.9.5.linux.bin.tar.gz -O- | sudo tar --strip-components=1 -C /usr -xz doxygen-1.9.5
      - name: Build FFI and JNI
        run: cargo build --release -p dnp3-ffi-c -p dnp3-ffi-java
      - name: Build Rustdoc
        run: cargo doc -p dnp3 --no-deps
      - name: C bindings
        run: cargo run --bin dnp3-bindings -- --c --doxygen --no-tests
      - name: .NET bindings
        run: cargo run --bin dnp3-bindings -- --dotnet --doxygen --no-tests
      - name: Java bindings
        run: cargo run --bin dnp3-bindings -- --java
      - name: Extract documentation
        run: |
          mkdir -p ~/doc
          cp -a target/doc ~/doc/rust
          cp -a ffi/bindings/c/generated/doc/c ~/doc/c
          cp -a ffi/bindings/c/generated/doc/cpp ~/doc/cpp
          cp -a ffi/bindings/dotnet/dnp3/doc ~/doc/dotnet
          cp -a ffi/bindings/java/dnp3/target/apidocs ~/doc/java
          rm ffi/bindings/c/generated/logo.png ffi/bindings/c/generated/doxygen-awesome.css
      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: doc-api
          path: ~/doc
    # Build bindings on Windows x64 [64-bit MSVC (Windows 7+) (x86_64-pc-windows-msvc)] and x86 [32-bit MSVC (Windows 7+) (i686-pc-windows-msvc)]
  # Paused on PRs during the 1.8.0 refactor series; release tags still build them. Restore before 1.8.0
  bindings-windows:
    if: startsWith(github.ref, 'refs/tags/')
    # Release tags build the shipped libraries with one codegen unit and thin LTO (smaller and faster,
    # but slower to build); other runs keep cargo's release defaults. Symbols are not stripped
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'thin' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc # 64-bit MSVC (Windows 7+)
            test: true
          - target: i686-pc-windows-msvc # 32-bit MSVC (Windows 7+)
            test: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install NASM
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Create FFI modules DIR
        run: mkdir ffi-modules\${{ matrix.target }}
      - name: Build FFI
        shell: bash
        run: bash .github/scripts/build-evidence.sh evidence/ffi/${{ matrix.target }} cargo -p dnp3-ffi-c --target ${{ matrix.target }} --no-default-features --features serial,tls-aws-lc
      - name: Build JNI
        shell: bash
        run: bash .github/scripts/build-evidence.sh evidence/java/${{ matrix.target }} cargo -p dnp3-ffi-java --target ${{ matrix.target }} --no-default-features --features serial,tls-aws-lc
      - name: Copy the FFI and JNI libs
        shell: pwsh
        run: |
          Copy-Item -Path ./target/${{ matrix.target }}/release/dnp3_ffi.dll -Destination ffi-modules/${{ matrix.target }}
          Copy-Item -Path ./target/${{ matrix.target }}/release/dnp3_ffi.dll.lib -Destination ffi-modules/${{ matrix.target }}
          Copy-Item -Path ./target/${{ matrix.target }}/release/dnp3_ffi_java.dll -Destination ffi-modules/${{ matrix.target }}
      - name: Upload compiled FFI modules
        uses: actions/upload-artifact@v7
        with:
          name: ffi-modules-${{ matrix.target }}
          path: ffi-modules
      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.target }}
          path: evidence
      - name: Test C Bindings
        if: ${{ matrix.test }}
        run: cargo run --bin dnp3-bindings -- --c -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
      - name: Test .NET Bindings
        if: ${{ matrix.test }}
        run: cargo run --bin dnp3-bindings -- --dotnet -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
      - name: Test Java
        if: ${{ matrix.test }}
        run: cargo run --bin dnp3-bindings -- --java -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
  # Build bindings on MacOS [64-bit macOS (10.7+, Lion+) (x86_64-apple-darwin)]
  # Paused on PRs during the 1.8.0 refactor series; release tags still build them. Restore before 1.8.0
  bindings-macos:
    if: startsWith(github.ref, 'refs/tags/')
    # Release tags build the shipped libraries with one codegen unit and thin LTO (smaller and faster,
    # but slower to build); other runs keep cargo's release defaults. Symbols are not stripped
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'thin' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Create FFI modules dir
        run: mkdir -p ffi-modules/${{ matrix.target }}
      - name: Build FFI
        run: bash .github/scripts/build-evidence.sh evidence/ffi/${{ matrix.target }} cargo -p dnp3-ffi-c --target ${{ matrix.target }} --no-default-features --features serial,tls-aws-lc
      - name: Build JNI
        run: bash .github/scripts/build-evidence.sh evidence/java/${{ matrix.target }} cargo -p dnp3-ffi-java --target ${{ matrix.target }} --no-default-features --features serial,tls-aws-lc
      - name: Copy the FFI and JNI libs
        run: |
          cp ./target/${{ matrix.target }}/release/libdnp3_ffi.dylib ./ffi-modules/${{ matrix.target }}
          cp ./target/${{ matrix.target }}/release/libdnp3_ffi_java.dylib ./ffi-modules/${{ matrix.target }}
      - name: Upload compiled FFI modules
        uses: actions/upload-artifact@v7
        with:
          name: ffi-modules-${{ matrix.target }}
          path: ffi-modules
      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.target }}
          path: evidence
      - name: Test .NET bindings
        run: cargo run --bin dnp3-bindings -- --dotnet -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
      - name: Test Java bindings
        run: cargo run --bin dnp3-bindings -- --java -r ${{ matrix.target }} -a ./target/${{ matrix.target }}/release
  # Cross-compilation for Linux to produce portable C and JNI libraries
  bindings-linux:
    # Release tags build the shipped libraries with one codegen unit and thin LTO (smaller and faster,
    # but slower to build); other runs keep cargo's release defaults. Symbols are not stripped
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'thin' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}
      # By default, MUSL will not produce a cdylib with dynamic linkage to MUSL LIB C
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=-crt-static"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=-crt-static"
      CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_RUSTFLAGS: "-C target-feature=-crt-static"
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu # 64-bit Linux (kernel 2.6.32+, glibc 2.11+)
          - i686-unknown-linux-gnu # 32-bit Linux (kernel 3.2+, glibc 2.17+)
          - x86_64-unknown-linux-musl # 64-bit Linux with MUSL
          - arm-unknown-linux-gnueabihf # ARMv6 Linux, hardfloat (kernel 3.2, glibc 2.17)
          - arm-unknown-linux-musleabihf # ARMv6 Linux with MUSL, hardfloat
          - aarch64-unknown-linux-gnu # ARM64 Linux (kernel 4.2, glibc 2.17+)
          - aarch64-unknown-linux-musl # ARM64 Linux with MUSL
          - armv7-unknown-linux-gnueabihf # ARMv7 Linux, hardfloat (kernel 3.2, glibc 2.17)
          - arm-unknown-linux-gnueabi # ARMv6 Linux (kernel 3.2, glibc 2.17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Rust Cross
        run: cargo install cross
      - name: Create FFI modules dir
        run: mkdir -p ffi-modules/${{ matrix.target }}
      - name: Build FFI
        run: bash .github/scripts/build-evidence.sh evidence/ffi/${{ matrix.target }} cross -p dnp3-ffi-c --target ${{ matrix.target }} --no-default-features --features serial,tls-aws-lc
      - name: Build JNI
        run: bash .github/scripts/build-evidence.sh evidence/java/${{ matrix.target }} cross -p dnp3-ffi-java --target ${{ matrix.target }} --no-default-features --features serial,tls-aws-lc
      - name: Copy the FFI and JNI libs
        run: |
          cp ./target/${{ matrix.target }}/release/libdnp3_ffi.so ./ffi-modules/${{ matrix.target }}
          cp ./target/${{ matrix.target }}/release/libdnp3_ffi_java.so ./ffi-modules/${{ matrix.target }}
      - name: Upload compiled FFI modules
        uses: actions/upload-artifact@v7
        with:
          name: ffi-modules-${{ matrix.target }}
          path: ffi-modules
      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.target }}
          path: evidence
  # Run the bindings' smoke tests (C, C++, .NET, Java) against libraries built like the shipped ones
  bindings-test:
    uses: ./.github/workflows/bindings-test.yml
  # Paused on PRs during the 1.8.0 refactor series; release tags still build them. Restore before 1.8.0
  guide:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        working-directory: guide
        run: npm ci
      - name: Build guide
        working-directory: guide
        run: |
         npm run build
         mkdir -p ~/doc/guide
         mv build/* ~/doc/guide
      - name: Upload guide
        uses: actions/upload-artifact@v7
        with:
          name: doc-guide
          path: ~/doc
  # Package all the generated bindings
  # Paused on PRs during the 1.8.0 refactor series; release tags still package. Restore before 1.8.0
  packaging:
    needs: [documentation, guide, bindings-windows, bindings-macos, bindings-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install bom-tools
        run: cargo install --locked --git https://github.com/stepfunc/bom-tools.git --tag 0.3.0
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download compiled FFI
        uses: actions/download-artifact@v8
        with:
          path: ffi-modules
          pattern: ffi-modules-*
          merge-multiple: true
      - name: Download build evidence
        uses: actions/download-artifact@v8
        with:
          path: evidence
          pattern: evidence-*
          merge-multiple: true
      - name: Create third-party license reports and SBOMs
        run: |
          cargo metadata --format-version 1 --all-features --locked > metadata.json
          COMMON="-m metadata.json -c allowed.json"
          bom-tools licenses -e evidence/ffi --root-package dnp3-ffi-c $COMMON > third-party-licenses.txt
          bom-tools licenses -e evidence/java --root-package dnp3-ffi-java $COMMON > third-party-licenses-java.txt
          mkdir sboms
          bom-tools sbom -e evidence/ffi --root-package dnp3-ffi-c $COMMON --lockfile Cargo.lock > sboms/dnp3-ffi.cdx.json
          bom-tools sbom -e evidence/java --root-package dnp3-ffi-java $COMMON --lockfile Cargo.lock > sboms/dnp3-ffi-java.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sboms
          path: sboms
      - name: Package C/C++ bindings
        run: cargo run --bin dnp3-bindings -- --c --package ./ffi-modules --options ./packaging.json -f third-party-licenses.txt -f sboms/dnp3-ffi.cdx.json
      - name: Package .NET bindings
        run: cargo run --bin dnp3-bindings -- --dotnet --package ./ffi-modules --options ./packaging.json -f third-party-licenses.txt -f sboms/dnp3-ffi.cdx.json
      - name: Package Java bindings
        run: cargo run --bin dnp3-bindings -- --java --package ./ffi-modules --options ./packaging.json -f third-party-licenses-java.txt -f sboms/dnp3-ffi-java.cdx.json
      - name: Upload C/C++ bindings
        uses: actions/upload-artifact@v7
        with:
          name: c-bindings
          path: ffi/bindings/c/generated/*
      - name: Upload .NET bindings
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-bindings
          path: ffi/bindings/dotnet/nupkg/dnp3*
      - name: Upload Java bindings
        uses: actions/upload-artifact@v7
        with:
          name: java-bindings-jar
          path: ffi/bindings/java/dnp3/target/*.jar
      - name: Upload Java pom.xml
        uses: actions/upload-artifact@v7
        with:
          name: java-bindings-pom
          path: ffi/bindings/java/dnp3/pom.xml
  # Run the conformance tests for releases; PRs labeled `conformance` run them through conformance.yml itself
  conformance:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/conformance.yml
  # The check branch protection requires: passes only if every job a PR runs passed
  ci-ok:
    needs: [linting, msrv, test, no-panic, features, bindings-linux, bindings-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the CI jobs
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
  # Quality gate to ensure all tests pass before releases
  quality-gate:
    needs: [linting, msrv, test, features, bindings-test, conformance]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Quality checks passed
        run: echo "✅ All quality checks passed successfully"

  # Release jobs - each can run independently and is idempotent
  # crates.io and nuget.org trust this workflow in these environments (trusted publishing), so
  # neither needs a stored API key
  release-crates-io:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the crate version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dnp3") | .version')
          if [ "$VERSION" != "${{github.ref_name}}" ]; then
            echo "❌ tag ${{github.ref_name}} doesn't match the crate version $VERSION"
            exit 1
          fi
      - name: Check whether this version is already published
        id: published
        run: |
          VERSION=${{github.ref_name}}
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-all-errors \
            -A "stepfunc/dnp3 release workflow" "https://crates.io/api/v1/crates/dnp3/$VERSION")
          case "$STATUS" in
            200)
              echo "✅ dnp3 $VERSION already published to crates.io - skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "Publishing dnp3 $VERSION to crates.io..."
              ;;
            *)
              echo "❌ crates.io returned HTTP $STATUS"
              exit 1
              ;;
          esac
      - name: Authenticate with crates.io
        if: steps.published.outputs.skip != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        if: steps.published.outputs.skip != 'true'
        run: cargo publish -p dnp3
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release-docs:
    needs: [packaging, quality-gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: doc-*
      - name: Download conformance test results
        uses: actions/download-artifact@v8
        with:
          # each revision's artifact holds <revision>/L<level>/, so they merge without colliding
          pattern: conformance-results-*
          merge-multiple: true
          path: artifacts/conformance-results
      - name: Index the conformance test reports
        working-directory: artifacts/conformance-results
        run: |
          {
            echo '<!DOCTYPE html>'
            echo '<html><head><meta charset="utf-8"><title>dnp3 conformance test reports</title></head><body>'
            echo '<h1>dnp3 conformance test reports</h1><ul>'
            for report in */L*/report.html; do
              echo "<li><a href=\"$report\">Revision ${report%%/*}, subset level $(echo "$report" | cut -d/ -f2 | tr -d L)</a></li>"
            done
            echo '</ul></body></html>'
          } > index.html
          cat index.html
      - name: Checkout stepfunc/docs
        uses: actions/checkout@v6
        with:
          repository: stepfunc/docs
          ssh-key: ${{ secrets.SFIO_DOCS_SSH_KEY }}
          path: docs
      - name: Upload docs
        working-directory: docs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # Pull latest changes to avoid conflicts
          git pull
          # Remove and recreate docs directory
          rm -rf ./dnp3/${{github.ref_name}}
          mkdir -p ./dnp3/${{github.ref_name}}
          cp -a ../artifacts/doc-api/* ./dnp3/${{github.ref_name}}
          cp -a ../artifacts/doc-guide/* ./dnp3/${{github.ref_name}}
          cp -a ../artifacts/conformance-results ./dnp3/${{github.ref_name}}/conformance
          # Remove versions superseded under the docs repo's retention policy
          ./scripts/prune.sh
          # Send docs.stepfunc.io/dnp3/ to the guide of the newest full release (not milestones or RCs),
          # so a maintenance release of an older version doesn't move it back
          latest=$(ls ./dnp3 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -n "$latest" ]]; then
            echo "<!DOCTYPE html><meta charset=\"utf-8\"><title>DNP3 documentation</title><meta http-equiv=\"refresh\" content=\"0; url=./$latest/guide/\"><link rel=\"canonical\" href=\"./$latest/guide/\">" > ./dnp3/index.html
          fi
          # Check if there are actual changes to commit
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit - docs already up to date"
          else
            git commit -m "[dnp3] release ${{github.ref_name}}"
            git push
          fi
  
  release-maven:
    needs: [packaging, quality-gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Java artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: java-bindings-*
      - name: Import PGP key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.SFIO_PGP_PRIVATE_KEY }}
          passphrase: ${{ secrets.SFIO_PGP_PRIVATE_KEY_PASSPHRASE }}
      - name: Deploy Java to Maven Central
        shell: bash
        working-directory: artifacts
        run: |
          # Check if artifact already exists or is being published
          if curl -f -s -o /dev/null "https://repo1.maven.org/maven2/io/stepfunc/dnp3/${{github.ref_name}}/dnp3-${{github.ref_name}}.jar"; then
            echo "✅ Artifact io.stepfunc:dnp3:${{github.ref_name}} already exists in Maven Central - skipping deployment"
          else
            echo "Artifact not found in Maven Central - checking if deployment is in progress..."
            
            # Create base64 encoded token for Authorization header
            AUTH_TOKEN=$(echo -n "${{ secrets.MAVEN_CENTRAL_USERNAME }}:${{ secrets.MAVEN_CENTRAL_TOKEN }}" | base64 -w 0)
            
            # Try to upload - if it fails due to duplicate, that means it's already being processed
            echo "Attempting to upload to Central Portal..."
            
            # Create Maven repository structure (starting from groupId)
            mkdir -p io/stepfunc/dnp3/${{github.ref_name}}
            
            # Copy artifacts to bundle directory
            cp java-bindings-pom/pom.xml io/stepfunc/dnp3/${{github.ref_name}}/dnp3-${{github.ref_name}}.pom
            cp java-bindings-jar/dnp3-${{github.ref_name}}.jar io/stepfunc/dnp3/${{github.ref_name}}/
            cp java-bindings-jar/dnp3-${{github.ref_name}}-sources.jar io/stepfunc/dnp3/${{github.ref_name}}/
            cp java-bindings-jar/dnp3-${{github.ref_name}}-javadoc.jar io/stepfunc/dnp3/${{github.ref_name}}/
            
            # Sign all files
            cd io/stepfunc/dnp3/${{github.ref_name}}
            for file in *.jar *.pom; do
              gpg --batch --yes --pinentry-mode loopback --local-user "${{ steps.import_gpg.outputs.fingerprint }}" --passphrase "${{ secrets.SFIO_PGP_PRIVATE_KEY_PASSPHRASE }}" --armor --detach-sign "$file"
            done
            
            # Generate checksums
            for file in *.jar *.pom; do
              md5sum "$file" | cut -d' ' -f1 > "$file.md5"
              sha1sum "$file" | cut -d' ' -f1 > "$file.sha1"
            done
            
            # Create bundle zip
            cd ../../../..
            zip -r bundle.zip io/
            
            # Upload bundle to Central Portal
            echo "Uploading bundle to Central Portal..."
            RESPONSE=$(curl -X POST \
              "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
              -H "Authorization: Bearer $AUTH_TOKEN" \
              -H "Content-Type: multipart/form-data" \
              -F "bundle=@bundle.zip;type=application/octet-stream" \
              -w "\nHTTP_STATUS:%{http_code}" \
              -s)
            
            # Extract HTTP status code
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | sed '$d')  # Remove last line with status code
            
            echo "Response: $BODY"
            echo "HTTP Status: $HTTP_STATUS"
            
            # Handle response
            if [[ $HTTP_STATUS -ge 200 && $HTTP_STATUS -lt 300 ]]; then
              # The API returns the deployment ID as plain text, not JSON
              DEPLOYMENT_ID=$(echo "$BODY" | tr -d '[:space:]')
              echo "✅ Upload successful! Deployment ID: $DEPLOYMENT_ID"
              echo "The deployment will be automatically published to Maven Central after validation."
            elif [[ $HTTP_STATUS -eq 400 ]] && [[ "$BODY" =~ "duplicate" || "$BODY" =~ "already exists" || "$BODY" =~ "PUBLISHED" ]]; then
              echo "✅ Version ${{github.ref_name}} is already uploaded or being processed - skipping deployment"
            else
              echo "❌ Upload failed with status $HTTP_STATUS"
              echo "Error details: $BODY"
              exit 1
            fi
          fi
  
  release-nuget:
    needs: [packaging, quality-gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download .NET artifacts
        uses: actions/download-artifact@v8
        with:
          name: dotnet-bindings
          path: artifacts/dotnet-bindings
      # the temporary API key lasts an hour, so get it just before pushing
      - name: Authenticate with nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet package
        shell: bash
        run: |
          # Use --skip-duplicate to make this idempotent
          dotnet nuget push $(find artifacts/dotnet-bindings/dnp3*.nupkg) \
            -s https://api.nuget.org/v3/index.json \
            -k ${{ steps.login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
  
  create-github-release:
    needs: [release-docs, release-maven, release-nuget, release-crates-io]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # creates the draft release and uploads its assets
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Package C Bindings and Conformance Results
        run: |
          mkdir release
          cd artifacts/c-bindings
          zip -r ../../release/dnp3-${{github.ref_name}}.zip .
          # each revision's results are in an artifact of its own, holding <revision>/L<level>/
          cd ../..
          mkdir conformance-results
          cp -a artifacts/conformance-results-*/. conformance-results/
          cd conformance-results
          zip -r ../release/conformance-results.zip .
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.zip
            artifacts/dotnet-bindings/dnp3*
            artifacts/java-bindings-jar/*.jar
            artifacts/sboms/*.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
